<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660">

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(11,13,11,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#52534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f7591f"/>
    </marker>
    <marker id="arrow-dream" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a70c7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="660" fill="#f5f4ed"/>
  <rect width="920" height="660" fill="url(#dots)" opacity="0.6"/>

  <!-- ═══════════════ ARROWS ═══════════════ -->

  <!-- Agent → Engine -->
  <line x1="460" y1="100" x2="460" y2="140" stroke="#52534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="408" y="113" width="104" height="14" rx="2" fill="#f5f4ed"/>
  <text x="460" y="123" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">child_process</text>

  <!-- Engine → DB (left) -->
  <line x1="180" y1="290" x2="180" y2="368" stroke="#52534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="136" y="322" width="88" height="14" rx="2" fill="#f5f4ed"/>
  <text x="180" y="332" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">better-sqlite3</text>

  <!-- Engine → DB (center) -->
  <line x1="460" y1="290" x2="460" y2="368" stroke="#52534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="408" y="322" width="104" height="14" rx="2" fill="#f5f4ed"/>
  <text x="460" y="332" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ / WRITE</text>

  <!-- Dream → DB (curved, from Dream box down to DB) -->
  <path d="M 738 276 L 738 340 L 680 368" stroke="#8b5cf6" stroke-width="1.2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow-dream)"/>
  <rect x="710" y="310" width="60" height="14" rx="2" fill="#f5f4ed"/>
  <text x="740" y="320" fill="#8b5cf6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">prune</text>

  <!-- Python subprocess (right side) -->
  <path d="M 640 290 L 640 356" stroke="#f7591f" stroke-width="1" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <rect x="596" y="310" width="88" height="14" rx="2" fill="#f5f4ed"/>
  <text x="640" y="320" fill="#f7591f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WASM</text>

  <!-- Python → DB -->
  <line x1="640" y1="404" x2="640" y2="428" stroke="#f7591f" stroke-width="1" fill="none" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

  <!-- ═══════════════ LAYER 1: Pi Agent ═══════════════ -->

  <rect x="340" y="64" width="240" height="36" rx="6" fill="#f5f4ed"/>
  <rect x="340" y="64" width="240" height="36" rx="6" fill="rgba(247,89,31,0.06)" stroke="#f7591f" stroke-width="1"/>
  <rect x="348" y="68" width="24" height="12" rx="2" fill="transparent" stroke="rgba(247,89,31,0.40)" stroke-width="0.8"/>
  <text x="360" y="77" fill="rgba(247,89,31,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
