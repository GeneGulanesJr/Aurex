  <text x="566" y="492" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">name · kind · signature · file · lang</text>

  <rect x="676" y="456" width="180" height="48" rx="4" fill="#f5f4ed"/>
  <rect x="676" y="456" width="180" height="48" rx="4" fill="none" stroke="rgba(11,13,11,0.15)" stroke-width="0.8"/>
