  <rect x="36" y="144" width="48" height="12" rx="2" fill="transparent" stroke="rgba(11,13,11,0.30)" stroke-width="0.8"/>
  <text x="60" y="153" fill="rgba(11,13,11,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
