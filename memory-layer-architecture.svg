  <text x="178" y="204" fill="#52534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Observations CRUD</text>
  <text x="178" y="220" fill="#52534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Update &amp; Delete in-place</text>
  <text x="178" y="236" fill="#52534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Deduplication (trigram)</text>
  <text x="178" y="252" fill="#52534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FTS5 Hybrid Search</text>
  <text x="178" y="268" fill="#52534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Priority-Weighted Context</text>

