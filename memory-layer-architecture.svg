<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1b365d"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <style><![CDATA[
      .bg{fill:#f8f6ef}.title{font:700 25px Georgia,serif;fill:#14213d}.subtitle{font:13px Georgia,serif;fill:#4b5563}.layer{fill:#fffdf7;stroke:#d7c9ad;stroke-width:1.5}.box{fill:#ffffff;stroke:#1b365d;stroke-width:1.4}.box2{fill:#eef6ff;stroke:#1b365d;stroke-width:1.4}.box3{fill:#f6f0ff;stroke:#7653b8;stroke-width:1.4}.box4{fill:#effaf4;stroke:#2f7d52;stroke-width:1.4}.label{font:700 14px Georgia,serif;fill:#111827}.small{font:12px Georgia,serif;fill:#374151}.mono{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#4b5563}.eyebrow{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;fill:#1b365d}.arrow{stroke:#1b365d;stroke-width:2;fill:none;marker-end:url(#arrow)}.soft{stroke:#6b7280;stroke-width:1.6;fill:none;marker-end:url(#arrow-soft);stroke-dasharray:5 4}.caption{font:12px Georgia,serif;fill:#6b5f4a}.note{fill:#fff8e6;stroke:#c8a64b;stroke-width:1.2}
    ]]></style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="600" y="46" text-anchor="middle">LaPis Modular Memory Architecture</text>
  <text class="subtitle" x="600" y="70" text-anchor="middle">One Pi extension and Node CLI, strict internal feature boundaries, one local SQLite memory store</text>

  <rect class="layer" x="60" y="105" width="1080" height="90" rx="16"/>
  <text class="eyebrow" x="85" y="130">CLIENT</text>
  <rect class="box2" x="430" y="125" width="340" height="48" rx="10"/>
  <text class="label" x="600" y="146" text-anchor="middle">Pi Coding Agent</text>
  <text class="mono" x="600" y="163" text-anchor="middle">hooks, tools, commands, context injection</text>

  <path class="arrow" d="M600 174 L600 220"/>

  <rect class="layer" x="60" y="220" width="1080" height="120" rx="16"/>
  <text class="eyebrow" x="85" y="245">EXTENSION ADAPTERS</text>
  <rect class="box" x="110" y="265" width="230" height="46" rx="10"/><text class="label" x="225" y="286" text-anchor="middle">Hook Adapters</text><text class="mono" x="225" y="303" text-anchor="middle">session + guardrails</text>
  <rect class="box" x="385" y="265" width="230" height="46" rx="10"/><text class="label" x="500" y="286" text-anchor="middle">Tool Adapters</text><text class="mono" x="500" y="303" text-anchor="middle">memory-code/doc/tools</text>
  <rect class="box" x="660" y="265" width="230" height="46" rx="10"/><text class="label" x="775" y="286" text-anchor="middle">Backend Client</text><text class="mono" x="775" y="303" text-anchor="middle">child process boundary</text>
  <rect class="box" x="925" y="265" width="160" height="46" rx="10"/><text class="label" x="1005" y="286" text-anchor="middle">Formatters</text><text class="mono" x="1005" y="303" text-anchor="middle">LLM output</text>

  <path class="arrow" d="M600 340 L600 380"/>

  <rect class="layer" x="60" y="380" width="1080" height="115" rx="16"/>
  <text class="eyebrow" x="85" y="405">COMMAND GATEWAY</text>
  <rect class="box2" x="170" y="425" width="300" height="44" rx="10"/><text class="label" x="320" y="446" text-anchor="middle">memory-store.js / cli.js</text><text class="mono" x="320" y="463" text-anchor="middle">runtime entry points</text>
  <rect class="box2" x="540" y="425" width="360" height="44" rx="10"/><text class="label" x="720" y="446" text-anchor="middle">src/cli/gateway.js + routers</text><text class="mono" x="720" y="463" text-anchor="middle">argument mapping, delegation only</text>
  <path class="arrow" d="M470 447 L540 447"/>

  <path class="arrow" d="M600 495 L600 535"/>

  <rect class="layer" x="60" y="535" width="1080" height="110" rx="16"/>
  <text class="eyebrow" x="85" y="560">FEATURE SERVICES</text>
  <rect class="box4" x="95" y="580" width="145" height="38" rx="9"/><text class="small" x="167" y="604" text-anchor="middle">memory-domain</text>
  <rect class="box4" x="260" y="580" width="145" height="38" rx="9"/><text class="small" x="332" y="604" text-anchor="middle">workflow-memory</text>
  <rect class="box4" x="425" y="580" width="145" height="38" rx="9"/><text class="small" x="497" y="604" text-anchor="middle">code-index</text>
  <rect class="box4" x="590" y="580" width="145" height="38" rx="9"/><text class="small" x="662" y="604" text-anchor="middle">code-analysis</text>
  <rect class="box4" x="755" y="580" width="145" height="38" rx="9"/><text class="small" x="827" y="604" text-anchor="middle">doc-index</text>
  <rect class="box4" x="920" y="580" width="145" height="38" rx="9"/><text class="small" x="992" y="604" text-anchor="middle">trust-sync</text>

  <path class="arrow" d="M600 645 L600 680"/>
  <rect class="layer" x="160" y="680" width="880" height="56" rx="16"/>
  <text class="eyebrow" x="185" y="704">PLATFORM</text>
  <text class="label" x="450" y="714" text-anchor="middle">storage repositories + config + protocol envelopes</text>
  <text class="mono" x="820" y="714" text-anchor="middle">SQLite / FTS5 / WAL</text>
  <rect class="box3" x="955" y="118" width="155" height="54" rx="10"/><text class="label" x="1032" y="140" text-anchor="middle">Crosshash</text><text class="mono" x="1032" y="157" text-anchor="middle">future backend boundary</text>
  <path class="soft" d="M955 145 C900 145 880 220 830 265"/>
</svg>