  <text x="736" y="542" fill="#52534e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">status · success · attempts · steps</text>

  <!-- ═══════════════ LEGEND ═══════════════ -->

  <line x1="32" y1="566" x2="888" y2="566" stroke="rgba(11,13,11,0.10)" stroke-width="0.8"/>
