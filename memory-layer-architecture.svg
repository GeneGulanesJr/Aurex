  <text x="362" y="492" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">id · name · session_log</text>

  <rect x="472" y="456" width="188" height="48" rx="4" fill="#f5f4ed"/>
  <rect x="472" y="456" width="188" height="48" rx="4" fill="none" stroke="rgba(11,13,11,0.15)" stroke-width="0.8"/>
