  <rect x="408" y="300" width="104" height="14" rx="2" fill="#f5f4ed"/>
  <text x="460" y="310" fill="#52534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ / WRITE</text>

