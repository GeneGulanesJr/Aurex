[ai]
enabled = true
auto_gate = true
provider = "ollama"
model = "llama3.1"
api_key_env = "OPENAI_API_KEY"
temperature = 0.0
max_tokens = 2048
confidence_auto_accept = 0.95
max_daily_cost_usd = 10.0

[indexing]
parallelism = 0
file_limit = 100000
ignore_patterns = ["target/**", "node_modules/**", ".git/**"]

[impact]
min_confidence = 0.5
risk_low = 0.3
risk_medium = 0.6
risk_high = 0.85

[output]
format = "json"
