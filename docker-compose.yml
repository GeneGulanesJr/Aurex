# Aurex — Full Stack
# Usage:  docker compose up --build -d    (rebuild + restart, data persists in volumes)
# Stops:  docker compose down             (data persists in volumes)
# Reset:  docker compose down -v          (destroys volumes + all data)

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.129.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "9464:9464"   # Prometheus scrape endpoint for Aurex app metrics
      - "8888:8888"   # Prometheus scrape endpoint for collector self-metrics
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    # NOTE: The otel-collector-contrib image is distroless (no shell,
    # wget, curl). Docker CMD healthchecks cannot run inside it. The
    # collector's built-in health_check extension exposes
    # http://localhost:13133/ which can be checked from other containers
    # or the Docker host. Remove Docker-level healthcheck to avoid
    # false "unhealthy" states blocking dependent services.
    # healthcheck:
    #   test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:13133/"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 5
    restart: unless-stopped

  lapis:
    build: { context: ., dockerfile: Dockerfile.lapis }
    ports: ["9100:9100"]
    volumes:
      # lapis-data persists GitHub login, PiNyx API keys, mission history
      - lapis-data:/root/.pi
      - ${REPO_ROOT:-/tmp}:/workspace
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9100/health').then(r=>r.json()).then(j=>{if(j.status!=='ok')process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pinyx:
    build: { context: ., dockerfile: Dockerfile.pinyx }
    ports: ["7331:7331"]
    environment:
      REPOS_DIR: /workspace/repos
    volumes:
      - pinyx-data:/data
      - ${REPO_ROOT:-/tmp}:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7331/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: { context: ., dockerfile: packages/backend/Dockerfile }
    ports: ["3000:3000"]
    environment:
      LAPIS_ENDPOINT: http://lapis:9100
      REPO_ROOT: /workspace
      AUREX_ROOT: /aurex
      GIT_MAIN_BRANCH: main
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-Iv23lijYF4sZMcU62MjT}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/api/github/callback}
      GITHUB_FRONTEND_URL: ${GITHUB_FRONTEND_URL:-http://localhost:8080}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-aurex-backend}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      OTEL_METRIC_EXPORT_TIMEOUT: ${OTEL_METRIC_EXPORT_TIMEOUT:-10000}
    volumes:
      - ${REPO_ROOT:-/tmp}:/workspace
      - .:/aurex
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lapis: { condition: service_healthy }
      pinyx: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
    ports: ["8080:443"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pinyx-data:
  lapis-data:
