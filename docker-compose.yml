# Aurex — Full Stack
# Usage:  docker compose build && docker compose up
# Stops:  Ctrl+C  or  docker compose down

services:
  lapis:
    build: { context: ., dockerfile: Dockerfile.lapis }
    ports: ["9100:9100"]
    volumes:
      - ${REPO_ROOT:-/tmp}:/workspace
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9100/health').then(r=>r.json()).then(j=>{if(j.status!=='ok')process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pinyx:
    build: { context: ., dockerfile: Dockerfile.pinyx }
    ports: ["7331:7331"]
    environment:
      REPOS_DIR: /workspace/repos
    volumes:
      - pinyx-data:/data
      - ${REPO_ROOT:-/tmp}:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7331/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: { context: ., dockerfile: packages/backend/Dockerfile }
    ports: ["3000:3000"]
    environment:
      LAPIS_ENDPOINT: http://lapis:9100
      REPO_ROOT: /workspace
      AUREX_ROOT: /aurex
      GIT_MAIN_BRANCH: main
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-Iv23lijYF4sZMcU62MjT}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/api/github/callback}
      GITHUB_FRONTEND_URL: ${GITHUB_FRONTEND_URL:-http://localhost:8080}
    volumes:
      - ${REPO_ROOT:-/tmp}:/workspace
      - .:/aurex:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lapis: { condition: service_healthy }
      pinyx: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: { context: ., dockerfile: packages/frontend/Dockerfile }
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pinyx-data:
