name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Gate: lint + test must pass before publish ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Verify package.json version matches the git tag (prevent accidental mismatch)
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "package.json: $PKG_VERSION  |  tag: $TAG_VERSION"
          [ "$PKG_VERSION" = "$TAG_VERSION" ] || { echo "::error::Version mismatch"; exit 1; }

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
